<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Big Captions — ตัวอักษรใหญ่ / คำบรรยายสด</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Big Captions">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23000'/%3E%3Ctext x='90' y='125' font-size='110' font-weight='700' text-anchor='middle' fill='%23ffe600' font-family='sans-serif'%3EAa%3C/text%3E%3C/svg%3E">
<link rel="manifest" href='data:application/manifest+json,{"name":"Big Captions","short_name":"Captions","display":"standalone","background_color":"#000000","theme_color":"#000000","start_url":"."}'>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#ffe600;--dim:#8a7d00;--bar:#161616;--bd:#444;--ui:#fff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
:root[data-theme="white"]{--fg:#fff;--dim:#888}
:root[data-theme="paper"]{--bg:#fff;--fg:#000;--dim:#777;--bar:#eee;--bd:#999;--ui:#000}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ui);font-family:"Noto Sans Thai",system-ui,sans-serif;display:flex;flex-direction:column}
.bar{background:var(--bar);border-bottom:2px solid var(--bd);padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select{font:inherit;font-weight:700;font-size:16px;min-height:44px;padding:0 14px;border-radius:8px;border:2px solid var(--bd);background:var(--bg);color:var(--ui);cursor:pointer}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #3da5ff;outline-offset:2px}
button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sp{flex:1}
#status{font-size:14px;opacity:.85}
.rec{background:#c0111f;border-color:#c0111f;color:#fff}
main{flex:1;min-height:0;display:flex;flex-direction:column}
#entry{display:none;padding:10px;border-bottom:2px solid var(--bd);background:var(--bar)}
#entry textarea{width:100%;height:84px;font:inherit;font-size:18px;padding:10px;border-radius:8px;border:2px solid var(--bd);background:var(--bg);color:var(--ui);resize:vertical}
#entry .row{display:flex;gap:8px;margin-top:8px}
#screen{flex:1;min-height:0;overflow-y:auto;padding:16px;color:var(--fg);font-weight:700;line-height:1.25;overflow-wrap:anywhere;font-size:56px}
#screen p{margin:0 0 .5em}
#screen .interim{color:var(--dim)}
#hint{color:var(--dim);font-weight:500}
label.size{display:flex;align-items:center;gap:6px;font-size:14px}
input[type=range]{width:110px;height:44px}
body.full .bar,body.full #entry{display:none}
#exit{display:none;position:fixed;right:10px;top:calc(10px + env(safe-area-inset-top,0px))}
body.full #exit{display:block}
</style>
</head>
<body>
<div class="bar" role="toolbar" aria-label="Controls">
  <button id="mTalk" aria-pressed="true">ฟังห้อง / Listen</button>
  <button id="mType" aria-pressed="false">พิมพ์ / Type</button>
  <select id="lang" aria-label="Language">
    <option value="th-TH">ไทย</option>
    <option value="en-US">English</option>
  </select>
  <button id="go">เริ่มฟัง / Start</button>
  <label class="size">ขนาด<input id="size" type="range" min="28" max="160" value="56" aria-label="Text size"></label>
  <select id="theme" aria-label="Colors">
    <option value="yellow">เหลืองบนดำ</option>
    <option value="white">ขาวบนดำ</option>
    <option value="paper">ดำบนขาว</option>
  </select>
  <button id="clear">ล้าง / Clear</button>
  <button id="fs">เต็มจอ / Fullscreen</button>
  <span class="sp"></span>
  <span id="status" role="status" aria-live="polite"></span>
</div>
<main>
  <div id="entry">
    <textarea id="txt" placeholder="พิมพ์ข้อความที่นี่ / Type your message here" aria-label="Message"></textarea>
    <div class="row"><button id="show">แสดงตัวใหญ่ / Show big</button></div>
  </div>
  <div id="screen" aria-live="polite"><p id="hint">กด “เริ่มฟัง” แล้วอนุญาตไมโครโฟน คำพูดในห้องจะขึ้นเป็นตัวใหญ่ที่นี่</p></div>
</main>
<button id="exit">ออก / Exit</button>
<script>
const $=id=>document.getElementById(id);
const screenEl=$('screen'),statusEl=$('status'),goBtn=$('go');
let mode='talk',rec=null,listening=false,wantOn=false,interimEl=null;

// settings (per-viewer convenience only)
function save(){try{localStorage.setItem('bc',JSON.stringify({s:$('size').value,t:$('theme').value,l:$('lang').value}))}catch(e){}}
function load(){try{const v=JSON.parse(localStorage.getItem('bc')||'null');if(v){$('size').value=v.s;$('theme').value=v.t;$('lang').value=v.l}}catch(e){}}
function apply(){screenEl.style.fontSize=$('size').value+'px';document.documentElement.dataset.theme=$('theme').value;save()}
load();apply();
$('size').oninput=apply;$('theme').onchange=apply;$('lang').onchange=()=>{save();if(listening){stop();setTimeout(start,300)}};

function setMode(m){
  mode=m;$('mTalk').setAttribute('aria-pressed',m==='talk');$('mType').setAttribute('aria-pressed',m==='type');
  $('entry').style.display=m==='type'?'block':'none';
  goBtn.style.display=m==='talk'?'':'none';
  if(m==='type'){stop();$('txt').focus()}
}
$('mTalk').onclick=()=>setMode('talk');$('mType').onclick=()=>setMode('type');

function clearHint(){const h=$('hint');if(h)h.remove()}
function addLine(text){clearHint();const p=document.createElement('p');p.textContent=text;screenEl.appendChild(p);trim();scroll()}
function scroll(){screenEl.scrollTop=screenEl.scrollHeight}
function trim(){while(screenEl.children.length>40)screenEl.removeChild(screenEl.firstChild)}

// Type mode
$('show').onclick=()=>{const t=$('txt').value.trim();if(!t)return;screenEl.innerHTML='';addLine(t);screenEl.scrollTop=0}
$('txt').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))$('show').click()});

// Listen mode
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function start(){
  if(!SR){statusEl.textContent='เบราว์เซอร์นี้ไม่รองรับ — ใช้ Chrome หรือ Safari / Use Chrome or Safari';return}
  wantOn=true;rec=new SR();rec.lang=$('lang').value;rec.continuous=true;rec.interimResults=true;
  rec.onstart=()=>{listening=true;goBtn.textContent='หยุด / Stop';goBtn.classList.add('rec');statusEl.textContent='กำลังฟัง… / Listening…'};
  rec.onresult=e=>{
    let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i];
      if(r.isFinal){if(interimEl){interimEl.remove();interimEl=null}addLine(r[0].transcript.trim())}
      else interim+=r[0].transcript;
    }
    if(interim){clearHint();if(!interimEl){interimEl=document.createElement('p');interimEl.className='interim';screenEl.appendChild(interimEl)}interimEl.textContent=interim;scroll()}
  };
  rec.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){wantOn=false;statusEl.textContent='ไมค์ถูกบล็อก — อนุญาตไมโครโฟนในเบราว์เซอร์ / Allow the microphone'}
    else if(e.error!=='no-speech'&&e.error!=='aborted')statusEl.textContent='ข้อผิดพลาด / Error: '+e.error;
  };
  rec.onend=()=>{listening=false;if(wantOn){try{rec.start()}catch(e){}}else{goBtn.textContent='เริ่มฟัง / Start';goBtn.classList.remove('rec')}};
  try{rec.start()}catch(e){}
}
function stop(){wantOn=false;if(rec){try{rec.stop()}catch(e){}}goBtn.textContent='เริ่มฟัง / Start';goBtn.classList.remove('rec');if(statusEl.textContent.startsWith('กำลังฟัง'))statusEl.textContent=''}
goBtn.onclick=()=>wantOn?stop():start();

$('clear').onclick=()=>{screenEl.innerHTML='';interimEl=null};
function enterFull(){document.body.classList.add('full');const d=document.documentElement;if(d.requestFullscreen)d.requestFullscreen().catch(()=>{})}
function exitFull(){document.body.classList.remove('full');if(document.fullscreenElement)document.exitFullscreen()}
$('fs').onclick=enterFull;$('exit').onclick=exitFull;
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('full')});
</script>
</body>
</html>
